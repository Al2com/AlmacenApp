# Entorno local de AlmacenApp: MySQL, backend (Laravel) y frontend (Vite).
# Las credenciales salen del archivo .env (no versionado). Ver .env.example.
# Todos los puertos se publican solo en 127.0.0.1.

services:
  db:
    image: mysql:8.4
    container_name: almacen-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - almacen-db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./BackAlmacen
    container_name: almacen-back
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8000"
    volumes:
      - ./BackAlmacen:/app

  frontend:
    image: node:20
    container_name: almacen-front
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:5173"
    volumes:
      - ./FrontAlmacen:/app

volumes:
  almacen-db-data:
